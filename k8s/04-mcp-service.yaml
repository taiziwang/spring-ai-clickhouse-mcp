# ============================================================================
# MCP 服务对外入口：NodePort
#
# 访问方式（任选其一，取决于你在哪台机器上）：
#   http://<任一节点 IP>:30801/mcp       ← MCP 端点（Streamable HTTP）
#   http://<任一节点 IP>:30801/health    ← 健康检查（ClickHouse 可达才 200）
#
# ⚠️ NodePort 的语义是「每个节点都监听这个端口」，所以集群里任何一个节点的 IP 都能访问，
#    流量由 kube-proxy 转发到真正有 Pod 的节点 —— 不需要知道 Pod 在哪。
#
# ⚠️ 端口是集群级资源：30801 已被其他命名空间占用时会报
#      "provided port is already allocated"，换个号即可
#      （先 `kubectl get svc -A` 看一眼谁占了）。
#
# ⚠️ 安全提醒：NodePort 会把服务暴露到节点网络，且本服务默认不做认证。
#    生产环境建议换成 Ingress + TLS + 认证，或至少用 NetworkPolicy 限制来源。
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: ckmcp
  namespace: ckmcp
  labels:
    app: ckmcp
    component: mcp
spec:
  type: NodePort
  selector:
    app: ckmcp
    component: mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      # 固定 NodePort（默认范围 30000-32767），便于写进客户端配置和防火墙规则。
      # 留空则由集群随机分配 —— 但那样每次重建 Service 端口都会变。
      nodePort: 30801
